name: ci

on:
  push:
    branches: ["agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  acceptance:
    name: acceptance (protected tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.acceptance.config.ts

  path-guard:
    name: path-guard (protected paths untouched)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-protected.sh HEAD
